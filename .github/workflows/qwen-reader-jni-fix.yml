name: Chtec Qwen ABI Fix v03
on:
  workflow_dispatch:
  push:
    branches: [ qwen-reader-jni-fix-v03 ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: integration
      - uses: actions/checkout@v4
        with:
          repository: Danmoreng/qwen3-tts-android
          ref: 35738304b31c425cc08fb5405372fedfd6531b3b
          submodules: recursive
          path: integration/upstream
      - name: Verify pinned upstream and native source
        working-directory: integration/upstream
        run: |
          test "$(git rev-parse HEAD)" = "35738304b31c425cc08fb5405372fedfd6531b3b"
          test "$(git -C external/qwen3-tts.cpp rev-parse HEAD)" = "4562731dc612cb87b4cd1eedac275a17d1078773"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Provision Android SDK NDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Apply patches and verify ACTUAL pinned C++ JNI ABI
        working-directory: integration
        run: |
          python3 scripts/qwen_apply_reader.py
          python3 scripts/qwen_apply_diagnostics.py
          python3 scripts/qwen_apply_streaming.py
          python3 scripts/qwen_apply_jni_fix.py
          python3 scripts/qwen_verify_jni_abi.py
      - name: Unit tests (chunking, checkpointed WAV)
        working-directory: integration/upstream
        run: bash ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Build corrected APK
        working-directory: integration/upstream
        run: bash ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Inspect APK and JNI symbol
        run: |
          mkdir -p artifacts
          cp integration/upstream/app/build/outputs/apk/debug/app-debug.apk artifacts/Chtec_Qwen_JNI_Fixed_v03.apk
          unzip -t artifacts/Chtec_Qwen_JNI_Fixed_v03.apk | tail -1
          unzip -p artifacts/Chtec_Qwen_JNI_Fixed_v03.apk lib/arm64-v8a/libqwen3_tts_jni.so > /tmp/jni.so
          grep -a -q 'Java_com_qwen_tts_studio_engine_QwenEngine_nativeSynthesizeStreaming' /tmp/jni.so
          sha256sum artifacts/Chtec_Qwen_JNI_Fixed_v03.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Chtec_Qwen_JNI_Fixed_v03
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
