name: Chtec Qwen Reader test
on:
  workflow_dispatch:
  push:
    branches: [ qwen-reader-v1 ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Get Chtec patch
        uses: actions/checkout@v4
        with:
          path: integration
      - name: Get pinned Qwen Android with native submodules
        uses: actions/checkout@v4
        with:
          repository: Danmoreng/qwen3-tts-android
          ref: 35738304b31c425cc08fb5405372fedfd6531b3b
          submodules: recursive
          path: integration/upstream
      - name: Verify pin
        working-directory: integration/upstream
        run: |
          test "$(git rev-parse HEAD)" = "35738304b31c425cc08fb5405372fedfd6531b3b"
          git submodule status --recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK/NDK tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Apply Reader integration
        working-directory: integration
        run: python3 scripts/qwen_apply_reader.py
      - name: Unit tests - chunker
        working-directory: integration/upstream
        run: bash ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Android debug APK
        working-directory: integration/upstream
        run: bash ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Check and copy APK
        run: |
          mkdir -p artifacts
          cp integration/upstream/app/build/outputs/apk/debug/app-debug.apk artifacts/Chtec_Qwen_Reader_v01.apk
          sha256sum artifacts/Chtec_Qwen_Reader_v01.apk
          unzip -t artifacts/Chtec_Qwen_Reader_v01.apk | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: Chtec_Qwen_Reader_v01
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
