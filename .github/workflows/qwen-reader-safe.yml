name: Chtec Qwen Safe V03
on:
  workflow_dispatch:
  push:
    branches: [ qwen-reader-safe-v03 ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: integration
      - uses: actions/checkout@v4
        with:
          repository: Danmoreng/qwen3-tts-android
          ref: 35738304b31c425cc08fb5405372fedfd6531b3b
          submodules: recursive
          path: integration/upstream
      - name: Verify unchanged upstream and native engine
        working-directory: integration/upstream
        run: |
          test "$(git rev-parse HEAD)" = "35738304b31c425cc08fb5405372fedfd6531b3b"
          git submodule status --recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Provision Android build dependencies
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Apply known baseline and safe reader patch
        working-directory: integration
        run: |
          python3 scripts/qwen_apply_reader.py
          python3 scripts/qwen_apply_diagnostics.py
          python3 scripts/qwen_apply_streaming.py
          python3 scripts/qwen_apply_safe.py
          python3 -m py_compile scripts/qwen_apply_safe.py
          python3 scripts/qwen_verify_safe.py
      - name: Unit tests (Reader text and checkpointed WAV)
        working-directory: integration/upstream
        run: bash ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Compile original JNI-based APK
        working-directory: integration/upstream
        run: bash ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Verify application package and APK structure
        shell: bash
        run: |
          mkdir -p artifacts
          cp integration/upstream/app/build/outputs/apk/debug/app-debug.apk artifacts/Chtec_Qwen_Safe_v03.apk
          unzip -t artifacts/Chtec_Qwen_Safe_v03.apk | tail -1
          unzip -p artifacts/Chtec_Qwen_Safe_v03.apk lib/arm64-v8a/libqwen3_tts_jni.so > /tmp/qwen_jni.so
          grep -a -q 'Java_com_qwen_tts_studio_engine_QwenEngine_nativeSynthesize' /tmp/qwen_jni.so
          sha256sum artifacts/Chtec_Qwen_Safe_v03.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Chtec_Qwen_Safe_v03
          path: artifacts/*.apk
          retention-days: 14
          if-no-files-found: error
